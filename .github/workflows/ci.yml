name: CI

# Checks that each push to main and each pull request type-checks, passes the unit tests, builds,
# and works end to end. It doesn't hold back deploys: Cloudflare Pages' Git integration builds every
# push to main on its own.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Every push to main deploys, so each one keeps
# its own run and result (its own group: one shared group would still cancel a waiting run).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Types, unit tests, build
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19 (actions/runner-images#14748), with another
    # WebKit build and other apt fonts than the Linux-only tolerances were measured on. Move both
    # jobs in one commit, after a green run there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Nothing here reads git history, so the default shallow checkout is enough.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --ignore-scripts

      # What the prebuild downloads: the numpy/pandas wheels, the C/C++ pack and the flowchart's
      # parser files, every file SHA-256 checked by its script. The key hashes the files that pin
      # them (src/flowchart/pack.ts holds the grammar pins). Restored after npm ci, which empties
      # node_modules/.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/
          key: runtimes-${{ hashFiles('node_modules/pyodide/package.json', 'src/runner/python-packages.ts', 'src/flowchart/pack.ts', 'scripts/fetch-*.mjs') }}

      - name: Typecheck
        run: npm run typecheck

      # The C/C++ pack (SHA-256 checked, from the cache when it is there) before the unit tests: the
      # test of src/editor/data/c-library.json regenerates it from the pack's sysroot, and fails in
      # CI when the pack is missing instead of skipping.
      - name: C/C++ pack
        run: node scripts/fetch-clang.mjs

      # The flowchart's parser files (SHA-256 checked): the unit tests load each grammar with the real
      # runtime, and fail in CI when the files are missing instead of skipping.
      - name: Flowchart parser files
        run: node scripts/fetch-flowchart-grammars.mjs

      - name: Unit tests
        run: npm test

      # Cloudflare Pages' build command: the prebuild (Pyodide copy and downloads), typecheck, vite build.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (${{ matrix.label || matrix.browser }})
    # A commit that doesn't build never takes the runners, and the check job has filled the cache.
    needs: check
    runs-on: ubuntu-24.04 # pinned with the check job (above)
    # On the runners (one worker) the Chromium and Firefox test steps take 25 to 34 minutes. WebKit's
    # took 46.5 unsharded (run 40535415597), close to the 60-minute limit, so it runs split by file
    # (https://playwright.dev/docs/test-sharding) into three shards. The 60-minute WebKit jobs of runs
    # 40546811002 and 40566760719 (shard 1/2) were install stalls (41.0 and 38.6 minutes in the
    # browser install step), not slow tests: the install step has its own time limit below.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The typing-speed test is its own project (playwright.config.ts) that depends on all three
          # engines; here only Chromium is installed, so it runs with Chromium's tests and --no-deps.
          # CI uses one worker, so it never runs next to another test.
          - browser: chromium
            extra: --project=speed --no-deps
          - browser: firefox
          - browser: webkit
            label: webkit 1/3
            extra: --shard=1/3
          - browser: webkit
            label: webkit 2/3
            extra: --shard=2/3
          - browser: webkit
            label: webkit 3/3
            extra: --shard=3/3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci --ignore-scripts

      # Same path and key as in the check job.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/
          key: runtimes-${{ hashFiles('node_modules/pyodide/package.json', 'src/runner/python-packages.ts', 'src/flowchart/pack.ts', 'scripts/fetch-*.mjs') }}

      # A stalled install (apt or the browser download) once took 41 minutes of the job's 60. Each
      # try gets 5 minutes and a stall is tried once more. Measured in the 5 green main runs of
      # 2026-10-23 to 10-26 (GitHub API step times): 13 of 15 installs took 18 to 58 s; the other
      # two took 564 s (firefox) and 1085 s (webkit), stalls these limits now cut short. A try
      # stopped mid-apt can leave dpkg half-configured, so the next try finishes that first.
      - name: Install ${{ matrix.browser }}
        timeout-minutes: 12
        run: |
          for try in 1 2; do
            if [ "$try" -gt 1 ]; then sudo dpkg --configure -a || true; fi
            timeout --kill-after=30s 5m npx playwright install --with-deps ${{ matrix.browser }} && exit 0
            echo "::warning::Install ${{ matrix.browser }}: try $try failed or stalled"
          done
          exit 1

      # Playwright's webServer runs `npm run build` and serves the production build with the
      # deployed site's headers; with CI set it uses one worker and the github reporter.
      - name: End-to-end tests
        run: npx playwright test --project=${{ matrix.browser }} ${{ matrix.extra }}

      # Also when the job is cancelled (the time limit): tests that failed before it keep their traces.
      - name: Keep failure details
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
